# Tells Railway's Nixpacks builder to install both Python and Node.js,
# build the React frontend during deploy, then start the Flask server.
# This means frontend/dist/ no longer needs to be committed to git.

[phases.setup]
nixPkgs = ["nodejs_22", "python313"]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "npm --prefix frontend install"
]

[phases.build]
cmds = ["npm --prefix frontend run build"]
